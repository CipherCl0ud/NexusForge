<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <!-- Pink to Blue Neon Gradient -->
    <linearGradient id="forgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    
    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Scaled up by 25% and centered with the Glow applied (Background removed) -->
  <g transform="translate(-12.5, -12.5) scale(1.25)" filter="url(#glow)">
    
    <!-- Outer Hexagon -->
    <polygon points="50,15 82,33 82,67 50,85 18,67 18,33" fill="none" stroke="url(#forgeGrad)" stroke-width="6" stroke-linejoin="round"/>
    
    <!-- Inner Nexus Node -->
    <circle cx="50" cy="50" r="10" fill="url(#forgeGrad)" />
    
    <!-- Connecting Data Lines -->
    <line x1="50" y1="15" x2="50" y2="40" stroke="url(#forgeGrad)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="24" y1="64" x2="42" y2="54" stroke="url(#forgeGrad)" stroke-width="4.5" stroke-linecap="round" />
    <line x1="76" y1="64" x2="58" y2="54" stroke="url(#forgeGrad)" stroke-width="4.5" stroke-linecap="round" />
    
  </g>
</svg>
